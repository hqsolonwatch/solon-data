name: District maps update

on:
  schedule:
    - cron: "41 9 3 * *"   # the 3rd of every month, 9:41 UTC
  workflow_dispatch: {}      # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Keep downloaded files between runs
        uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-${{ github.run_id }}
          restore-keys: downloads-

      - name: Run the pipeline
        id: run
        continue-on-error: true
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline.run districts

      - name: Save new data
        run: |
          git config user.name "solon-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: Report problems
        if: steps.run.outcome == 'failure'
        run: |
          echo "Some steps had problems. Open data/status_districts.json to see which."
          exit 1
