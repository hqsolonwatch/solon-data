# Hand-written one-sentence bill summaries. These replace the automatic first sentence
# of the Congressional Research Service summary. Key format: {type}{number}-{congress}
s4668-119: "Sets rules for name, image and likeness (NIL) deals for college athletes, caps sports agent fees at 5 percent, and gives schools and conferences a limited antitrust exemption to sell some media rights together."
s2403-119: "Lets the manager of an employee stock ownership plan rely on an independent appraiser’s value for company stock that is not publicly traded, as long as the appraisal follows set IRS methods."

# The Senate replaced the text of H.R. 2347 with the Bipartisan American Affordability and Jobs Act
# (Capito amendment No. 6883, adopted November 18, 2026) and passed it 62 to 33 on November 19, 2026.
# Sources: CRS reports R49506 and R49510; Senate Daily Press Gallery, November 18, 2026; Bipartisan Policy Center explainer.
hr2347-119:
  title: "Bipartisan American Affordability and Jobs Act of 2026"
  summary: "Rewrites federal environmental review and permitting rules for energy, mining, transmission and other infrastructure projects, including changes to the National Environmental Policy Act (NEPA)."
  points:
    - "Sets a 150-day deadline to sue over many federal permits and moves NEPA lawsuits to federal appeals courts"
    - "Limits when courts can cancel a permit over a flawed environmental review"
    - "Narrows which federal actions need a NEPA review and adds deadlines for agency permit decisions"
    - "Changes permitting under the Clean Water Act, the Endangered Species Act and the National Historic Preservation Act"
    - "Expands federal planning, siting and cost rules for electric transmission lines, including upgrades on existing routes"
    - "Adds provisions on geothermal, hydropower, offshore transmission and hardrock mining"
  source: "Solon Watch, based on Congressional Research Service reports R49506 and R49510"
  replaced: {label: "S.Amdt. 6883", chamber: "Senate", date: "2026-11-18"}
